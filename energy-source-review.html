<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Unity 原始光束 · 動態比較</title><style>
body{margin:0;background:#111b25;color:#edf2f6;font:15px system-ui;line-height:1.65}main{max-width:1450px;margin:auto;padding:28px}h1{font-size:26px;margin:0}p{color:#adc0ce}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px}article{background:#1c2b39;border:1px solid #334a5c;border-radius:10px;padding:16px}h2{font-size:18px;margin:0 0 8px}video{width:100%;background:#27333d;display:block}button{background:#badbd6;color:#122c33;border:0;padding:10px 16px;border-radius:5px;cursor:pointer;margin:6px}small{color:#a9bdcc}strong{color:#e7dcaa}.badge{color:#e7dcaa;font-size:13px}#status{color:#ffd1a1}@media(max-width:500px){section{grid-template-columns:1fr}main{padding:14px}}
</style><main><h1>Unity 原始光束 · 動態比較</h1><p>原始 prefab／模型／材質，在共用 URP 預覽環境播放。每段 4 秒、20 fps；不是 Babylon 重建，也不是遊戲效能測試。</p><p><strong>比較限制：</strong>兩包原始尺度與持續時間不同，鏡頭依包固定。Bloom、背景及鏡頭為測試設定；22 VFX 的外觀仍待對照作者展示場景，不能把目前畫面視為商品效果驗收。</p><button id="play">同步從頭播放</button><button id="pause">全部暫停</button><label>播放速度 <select id="speed"><option value="1">正常</option><option value="0.5">0.5 倍</option><option value="0.25">0.25 倍</option></select></label><p id="status"></p><section id="grid"></section><p>建議先比較 ArcaneRay 的流動外殼與 VoidRay 的暗色層次。短促爆發的 22 VFX 候選若用於持續照射，需另外製作維持階段。</p></main><script>
const catalogNotice=document.createElement('p');catalogNotice.innerHTML='<strong>本頁只有第一輪挑選的 6 套。</strong> <a style="color:#badbd6" href="/energy-catalog.html">前往六包完整素材目錄 →</a>';document.querySelector('main').prepend(catalogNotice);
const names=[['ArcaneRay','39 VFX · 優先研究','旋流與亮色外殼；目前最適合先拆解噴流結構。'],['VoidRay','39 VFX · 外層備選','偏暗色渦流；觀察亮暗交錯與噴口旋轉。'],['NatureRay','39 VFX · 風格對照','葉片與藤蔓明顯，不直接作為艦炮主方案。'],['PS_UltimateBeam_Void','22 VFX · 待核對','短促爆發。細線與色彩表現尚待核對原展示場景。'],['PS_UltimateBeam_Arcane','22 VFX · 待核對','提供瞬間爆發節奏比較，暫不作最終外觀判定。'],['PS_UltimateBeam_Dark','22 VFX · 待核對','提供消散與外層參考，暫不作最終外觀判定。']];
for(const [name,label,description] of names){const article=document.createElement('article');article.innerHTML=`<h2>${name}</h2><div class="badge">${label}</div><video controls muted playsinline preload="metadata" src="/vfx/energy-source-review/${name}.mp4"></video><p>${description}</p>`;document.querySelector('#grid').append(article);}
const videos=[...document.querySelectorAll('video')];
document.querySelector('#play').onclick=async()=>{document.querySelector('#status').textContent='';await Promise.all(videos.map(async v=>{v.currentTime=0;try{await v.play();}catch(e){document.querySelector('#status').textContent='部分影片尚未載入，請使用個別播放鍵。';}}));};
document.querySelector('#pause').onclick=()=>videos.forEach(v=>v.pause());
document.querySelector('#speed').onchange=e=>videos.forEach(v=>v.playbackRate=Number(e.target.value));
videos.forEach(v=>v.addEventListener('error',()=>document.querySelector('#status').textContent='影片載入失敗，請確認本機伺服器仍在執行。'));
</script></html>
